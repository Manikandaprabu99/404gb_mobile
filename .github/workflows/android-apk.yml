name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3

      # Each runner would otherwise generate a fresh debug key, and Android refuses
      # to install an APK over one signed with a different key.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 404gb-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk 404gb.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest 404gb.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "404GB Android (latest build)" \
            --notes "Debug build from commit ${GITHUB_SHA::7}. Sideload onto your own phone only."
