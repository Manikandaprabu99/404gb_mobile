name: Android APK

on:
  push:
    branches: [main, complete-app, standalone]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WEB_REPO: Manikandaprabu99/404GB_sourcecode
    steps:
      - uses: actions/checkout@v4

      # The app's UI is the web project's static export, bundled into the APK. Build it from the
      # web branch named like this branch when there is one, else from main.
      - name: Pick the web app branch
        id: web
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set +e
          git ls-remote --exit-code --heads "https://github.com/$WEB_REPO.git" "refs/heads/$BRANCH" > /dev/null
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            ref="$BRANCH"
          elif [ "$code" -eq 2 ]; then
            ref=main
          else
            echo "::error::Could not list the branches of $WEB_REPO (git ls-remote exit code $code)"
            exit 1
          fi
          echo "Building the UI from $WEB_REPO@$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the web app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.WEB_REPO }}
          ref: ${{ steps.web.outputs.ref }}
          path: web-src
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web-src/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Each runner would otherwise generate a fresh debug key, and Android refuses
      # to install an APK over one signed with a different key.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install dependencies
        run: npm ci

      # NEXT_PUBLIC_GITHUB_CLIENT_ID is inlined at build time; empty hides the Device Flow sign-in.
      - name: Build the web app
        working-directory: web-src
        run: |
          set -o pipefail
          export NEXT_PUBLIC_GITHUB_CLIENT_ID="$(tr -d '[:space:]' < ../config/github-client-id)"
          echo "GitHub OAuth client id: ${NEXT_PUBLIC_GITHUB_CLIENT_ID:-(none, token sign-in only)}"
          npm ci 2>&1 | tee "$RUNNER_TEMP/web-build.log"
          npm run build 2>&1 | tee -a "$RUNNER_TEMP/web-build.log"
          test -f out/index.html || { echo "::error::The web build produced no out/index.html (is output: \"export\" set?)"; exit 1; }

      - name: Bundle the web app as www/
        run: |
          rm -rf www
          cp -R web-src/out www

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 404gb-debug-apk-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # JVM unit tests (JsJson must write manifests byte-for-byte like the web app's JavaScript).
      # Report-only: failures become annotations but never hold back the APK or its release.
      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee -a "$RUNNER_TEMP/gradle-build.log"

      # Turns compiler/resource/manifest errors into annotations, which are
      # readable without signing in via the public check-runs API.
      - name: Report build errors
        if: failure()
        env:
          BUILD_LOG: ${{ runner.temp }}/gradle-build.log
        run: |
          [ -f "$BUILD_LOG" ] || exit 0
          python3 - <<'PY'
          import os, re

          log_path = os.environ["BUILD_LOG"]
          root = os.environ.get("GITHUB_WORKSPACE", "") + "/"
          lines = open(log_path, encoding="utf-8", errors="replace").read().splitlines()

          def esc_data(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def esc_prop(s):
              return esc_data(s).replace(":", "%3A").replace(",", "%2C")

          seen, out = set(), []

          def emit(message, file=None, line=None):
              message = message.strip()
              if not message or message in seen or len(out) >= 50:
                  return
              seen.add(message)
              props = []
              if file:
                  if file.startswith("file://"):
                      file = file[len("file://"):]
                  if file.startswith(root):
                      file = file[len(root):]
                  props.append("file=" + esc_prop(file))
                  if line:
                      props.append("line=" + esc_prop(str(line)))
              head = "::error " + ",".join(props) + "::" if props else "::error::"
              out.append(head + esc_data(message))

          javac = re.compile(r"^(/\S+?\.(?:java|kt)):(\d+): error: (.*)$")
          kotlin = re.compile(r"^e: (?:file://)?(/\S+?\.kt):(\d+):\d+ (.*)$")
          aapt = re.compile(r"^(?:ERROR: ?)?(/\S+?):(\d+)(?::\d+)?: AAPT: error: (.*)$")
          manifest = re.compile(r"^(/\S+?AndroidManifest\.xml):(\d+):[\d:-]+ Error:\s*(.*)$")
          for i, raw in enumerate(lines):
              text = raw.rstrip()
              m = javac.match(text)
              if m:
                  detail = m.group(3)
                  # javac prints the offending source line and a caret on the next lines.
                  if i + 1 < len(lines) and lines[i + 1].strip():
                      detail += " | " + lines[i + 1].strip()
                  emit(detail, m.group(1), m.group(2))
                  continue
              for pattern in (kotlin, aapt, manifest):
                  m = pattern.match(text)
                  if m:
                      detail = m.group(3)
                      # The manifest merger prints its message on the following line.
                      if not detail.strip() and i + 1 < len(lines):
                          detail = lines[i + 1].strip()
                      emit(detail, m.group(1), m.group(2))
                      break
              else:
                  if "AAPT: error:" in text or text.startswith("ERROR:") or "Manifest merger failed" in text:
                      emit(text)
                  elif re.match(r"^\S.*error: ", text) and "warning:" not in text:
                      emit(text)

          # Gradle's summary: "FAILURE: ..." followed by "* What went wrong:" and its detail lines.
          for i, raw in enumerate(lines):
              if raw.startswith("FAILURE:"):
                  detail = [raw.strip()]
                  for nxt in lines[i + 1:i + 40]:
                      if nxt.startswith("* Try:"):
                          break
                      if nxt.strip() and not nxt.startswith("* What went wrong"):
                          detail.append(nxt.strip())
                  emit(" ".join(detail)[:1500])

          if not out:
              emit("Gradle build failed; no compiler errors were recognised in the log (see the job output).")
          print("\n".join(out))
          PY

      - name: Report unit test failures
        if: steps.unit_tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET

          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          out = []
          for path in glob.glob("android/app/build/test-results/testDebugUnitTest/*.xml"):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      cls = case.get("classname", "")
                      source = "android/app/src/test/java/" + cls.replace(".", "/") + ".java"
                      message = (problem.get("message") or problem.text or "failed").strip()[:1500]
                      out.append("::error file=%s::%s.%s: %s" % (source, cls.split(".")[-1], case.get("name"), esc(message)))
          print("\n".join(out[:50]))
          PY

      - name: Report web build errors
        if: failure()
        env:
          WEB_LOG: ${{ runner.temp }}/web-build.log
          BUILD_LOG: ${{ runner.temp }}/gradle-build.log
        run: |
          # Only when the web build is what failed (Gradle never ran).
          [ -f "$WEB_LOG" ] && [ ! -f "$BUILD_LOG" ] || exit 0
          python3 - <<'PY'
          import os, re

          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          lines = open(os.environ["WEB_LOG"], encoding="utf-8", errors="replace").read().splitlines()
          hits = [l.strip() for l in lines if re.search(r"(Type error|Failed to compile|Error:|error TS\d+|ERR!|Module not found)", l)]
          if not hits:
              hits = [" | ".join(l.strip() for l in lines[-20:] if l.strip())]
          seen = []
          for hit in hits:
              if hit and hit not in seen and len(seen) < 30:
                  seen.append(hit)
                  print("::error title=Web app build::" + esc(hit[:1500]))
          PY

      - name: Publish to android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk 404gb.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest 404gb.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "404GB Android (latest build)" \
            --notes "Debug build from commit ${GITHUB_SHA::7}. Sideload onto your own phone only."
